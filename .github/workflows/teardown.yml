name: Teardown platform

# One-off decommission of the autonomous-developer platform (2026-10-01).
# Archives the run history, terminates any stray workers, destroys the
# Terraform stack, and removes the state object. Manual-dispatch only.
#
# NOT removed here (the CI role has no grant, or they live outside AWS):
#   - Secrets Manager: prog-strength-developer/{claude-credentials,github-app}
#   - GoDaddy A record: developers.progstrength.fitness
#   - GitHub App "Prog Strength Developer"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.10.5
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive run history from DynamoDB
        run: |
          aws dynamodb scan \
            --table-name prog-strength-developer-runs \
            --output json > developer-runs-archive.json
          echo "Archived $(jq '.Count' developer-runs-archive.json) items"

      - name: Upload run-history archive
        uses: actions/upload-artifact@v4
        with:
          name: developer-runs-archive
          path: developer-runs-archive.json
          retention-days: 90

      - name: Terminate any worker instances
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=prog-strength-developer-worker" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then
            echo "Terminating workers: $ids"
            aws ec2 terminate-instances --instance-ids $ids
            aws ec2 wait instance-terminated --instance-ids $ids
          else
            echo "No worker instances found"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=prog-strength-developer/${TF_STATE_ENV:-prod}/terraform.tfstate"

      - name: terraform destroy
        working-directory: terraform
        run: terraform destroy -auto-approve

      - name: Delete Terraform state object
        run: |
          aws s3 rm "s3://${TF_STATE_BUCKET}/prog-strength-developer/" --recursive
